[project]
name = "smart_urban_resilience"
version = "0.1.0"
description = "smart_urban_resilience using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=0.75.0",
    "crewai[tools]>=0.201.1,<1.0.0",
    "fiona>=1.10.1",
    "geopandas>=1.1.1",
    "geopy>=2.4.1",
    "joblib>=1.5.2",
    "numpy>=2.2.6",
    "openai>=1.109.1",
    "osmnx>=2.0.6",
    "pandas>=2.3.3",
    "psycopg2>=2.9.11",
    "psycopg2-binary>=2.9.11",
    "pulp>=3.3.0",
    "pyproj>=3.7.1",
    "qdrant-client>=1.15.1",
    "rasterio>=1.4.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.44",
    "timezonefinder>=8.1.0",
]

[project.scripts]
smart_urban_resilience = "smart_urban_resilience.main:run"
run_crew = "smart_urban_resilience.main:run"
train = "smart_urban_resilience.main:train"
replay = "smart_urban_resilience.main:replay"
test = "smart_urban_resilience.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
