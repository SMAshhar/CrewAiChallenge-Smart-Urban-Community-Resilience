data_collection_task:
  description: >
    Collect live data from simulated or connected city sources for the given {location} — including weather APIs, IoT sensors, traffic systems, and citizen feedback reports.
    Normalize this data into a consistent JSON format for downstream processing.
  expected_output: >
    A structured JSON object containing aggregated sensor readings, citizen reports, and timestamped data streams.
  agent: data_collector

data_normalization_task:
  description: >
    Standardize units, timexstamps, and location formats in the collected data.
    Enrich raw records with geolocation data and unify schemas across sources.
  expected_output: >
    A normalized dataset with consistent units, standardized keys, geocoded locations, and harmonized timestamps.
    Output will be as per provided output pydantic schema.
  agent: data_normalizer

data_validation_task:
  description: >
    Review and validate the normalized data for completeness, consistency, and logical accuracy.
    Detect missing values, duplicates, and anomalies; flag or correct them where possible.
  expected_output: >
    A cleaned and validated dataset annotated with validation results and any corrections or imputations made. A validation report summarizing data quality issues and resolutions.
  agent: data_validator

event_detection_task:
  description: >
    Identify patterns or anomalies within validated city data that correspond to urban events such as outages, traffic congestion, pollution spikes, or public safety incidents.
  expected_output: >
    A list of detected events, each tagged with type, location, time, and confidence score.
  agent: event_detector

impact_assessment_task:
  description: >
    Analyze detected events to evaluate their social, environmental, and infrastructural impact.
    Prioritize incidents based on severity, affected population, and urgency.
  expected_output: >
    An event impact report with severity scores, affected zones, and suggested priority levels.
  agent: impact_assessor

resource_recommendation_task:
  description: >
    Recommend optimal allocation of urban resources and response teams based on assessed event impacts and available logistics data.
  expected_output: >
    A resource deployment plan specifying personnel, equipment, and locations for optimal response.
  agent: resource_recommender

logistics_planning_task:
  description: >
    Generate optimized travel routes and schedules for emergency or maintenance vehicles.
    Factor in traffic, road closures, and proximity to event sites.
  expected_output: >
    A routing plan with optimized paths, estimated travel times, and scheduling recommendations.
  agent: logistics_agent


incident_command_task:
  description: >
    Review automated event assessments, recommendations, and drafted communications.
    Produce an approval decision (approve/modify/reject) along with any edited message text or instructions.
    If you find the severity high, always approve. If you find the severity low, you may choose to modify or reject.
  expected_output: >
    {
      "approval":"approve|reject|modify",
      "comments":"optional human notes",
      "approved_messages":[{"channel":"sms", "text":"...", "recipients":[...}, ...]
    }
  agent: incident_commander
  

communication_task:
  description: >
    Generate final messages for citizens and deparmtents from the approved drafts and send them through
    the configured channels. Use the "message_normalizing_tool" provided to get the input for "communication_tool"
    When you call the Communication Tool, pass JSON with key "messages": a list of message objects. Each message object should have:
    - id: unique string (UUID or "ev-123-msg-1"). If absent, tool will auto-generate.
    - channel: "sms"|"whatsapp"|"email"
    - to: recipient contact (E.164 phone like "+1555..." or email). Alternatively, you may use `recipients`: ["all"] or ["contact-id-1"], which the tool will expand.
    - body OR text: the final message string. Template + template_vars allowed.
    - metadata: optional.

    Example:
    {
      "messages": [
        {"id":"m-1", "channel":"sms", "to":"+15551234567", "body":"Heat alert..."},
        {"channel":"sms", "recipients":["all"], "body":"Pollen alert..."}
      ],
      "dry_run": true
    }

    This task MUST check the output  of the incident_command_task andony send when approval == "approve".
  expected_output: >
    A JSON log of messages generated and (if sent) the sending results (dry-run mode recommended for demos).
  agent: communicator

learning_feedback_task:
  description: >
    Evaluate post-action performance of all automated and human decisions.
    Identify system weaknesses, retrain models, and update knowledge bases for continual improvement.
  expected_output: >
    A feedback report summarizing lessons learned, retraining data, and updated model configurations.
  agent: learning_agent

privacy_compliance_task:
  description: >
    Continuously monitor data pipelines for compliance with privacy, consent, and data protection rules.
    Try the privacy tool if need to redact information.
    Anonymize sensitive fields and ensure secure storage of personal data.
  expected_output: >
    A compliance report confirming anonymization, consent adherence, and privacy safeguards.
  agent: privacy_manager
