[project]
name = "smart_urban_resilience"
version = "0.1.0"
description = "smart_urban_resilience using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0",
    "geopy>=2.4.1",
    "timezonefinder>=8.1.0",
]

[project.scripts]
smart_urban_resilience = "smart_urban_resilience.main:run"
run_crew = "smart_urban_resilience.main:run"
train = "smart_urban_resilience.main:train"
replay = "smart_urban_resilience.main:replay"
test = "smart_urban_resilience.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
